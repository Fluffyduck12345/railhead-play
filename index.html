e":`Sonderzüge`,"hud.sp.strip":`Deine Sonderzüge`,"hud.sp.armored":`Panzerzug`,"hud.sp.hospital":`Lazarettzug`,"hud.sp.engineer":`Pionierzug`,"hud.sp.buy":`Kaufen und herschicken`,"hud.sp.send":`Herschicken`,"hud.sp.here":`Steht hier`,"hud.sp.coming":`Unterwegs hierher`,"hud.sp.fx.armored":`Panzerzug: Angriff +{pct} %`,"hud.sp.fx.hospital":`Lazarettzug: heilt {n}× schneller`,"hud.sp.fx.engineer":`Pionierzug: repariert gratis`,"hud.sp.state.none":`{train}: noch nicht gekauft`,"hud.sp.state.moving":`{train}: unterwegs nach {name}`,"hud.sp.state.stationed":`{train}: steht in {name}`,"hud.sp.chip.moving":`→ {name}`,"hud.radio.gen":`Gen. {name}`,"hud.radio.title":`Funkspruch`,"hud.loot.note":`+{crates} Kisten, +{money} Geld`,"hud.tut.title":`Einweisung`,"hud.tut.1":`Deine Armeen brauchen Nachschub.`,"hud.tut.2.factory":`Wähl Route und zieh von der Fabrik zum Depot.`,"hud.tut.2.port":`Wähl Route und zieh vom Hafen zum Depot.`,"hud.tut.2.hq":`Wähl Route und zieh vom Hauptquartier zum Depot.`,"hud.tut.3":`Setz einen zweiten Lastwagen ein.`,"hud.tut.4":`Versorgte Armeen rücken vor.`,"hud.tut.5":`Bau eine Straße ins neue Land und ein Depot nah der Front.`,"hud.tut.6":`Erobere das feindliche Hauptquartier.`,"hud.tut.skip":`Überspringen`,"hud.tut.next":`Weiter`,"hud.tut.step":`{n}/{total}`}},Bc={en:{"level.1.name":`First Haul`,"level.1.brief":`Your trucks already run from the factory to a depot at the front. Add more trucks so the armies stay fed, then build roads and a depot behind them as they advance.`,"level.2.name":`Open Road`,"level.2.brief":`A road leads to the front, but there is no depot yet. Build one right behind the front, open a route from the factory and buy trucks.`,"level.3.name":`Twin Bridges`,"level.3.brief":`A river splits your land and bridges cost almost twice as much. Run a second route from your other factory so one broken bridge cannot starve the front.`,"level.4.name":`Air Alarm`,"level.4.brief":`Enemy planes now bomb your roads and bridges. Repair damaged links quickly and keep a little money back for it.`,"level.5.name":`Iron Line`,"level.5.brief":`Rail is unlocked. A road route takes at most four slow trucks, and on long routes they cannot keep up. Upgrade your longest busy road to rail: one train carries as much as seven trucks.`,"level.6.name":`Quiet Fuse`,"level.6.brief":`You can sabotage enemy links now. Blow the bridge or road that feeds the province you want to take, then push while it is cut off.`,"level.7.name":`Mud Season`,"level.7.brief":`Rain is coming and turns roads to mud: trucks slow to half speed. Trains do not care, so get a railway to the front before it starts.`,"level.8.name":`Full Tanks`,"level.8.brief":`Armor joins the fight and needs fuel from the refinery as well as supplies. Run a fuel route to the depots of your tank units, without fuel they are slow and weak.`,"level.9.name":`Hold Fast`,"level.9.brief":`The enemy is preparing a big offensive. You do not need to attack: keep your HQ until the time runs out. Stock up the depots near the front before the warning sounds.`,"level.10.name":`Deep Frost`,"level.10.brief":`Winter sets in soon after the start: armies eat more and every vehicle is slower. Fill the depots before the frost and plan more trucks per route than usual.`,"level.11.name":`Long Front`,"level.11.brief":`The front is long and thin: pick one sector, supply it fully and break through there. Special trains are unlocked now. Send the armored train along your rail to just behind that sector, and the armies next to it attack harder.`,"level.12.name":`Stone Gates`,"level.12.brief":`Mountains block most ways and building there is expensive. Use the passes and valleys for your lines and defend them well.`,"level.13.name":`Between Rivers`,"level.13.brief":`Two rivers cross the land and the clock is running. You do not need the HQ: take enough provinces before time is up.`,"level.14.name":`Storm Front`,"level.14.brief":`The enemy strikes first: its offensive starts almost at once. Survive it with full depots near the front, then hit back while the enemy rebuilds.`,"level.15.name":`End of the Line`,"level.15.brief":`The last battle, with everything at once and a strong enemy. Build rail early, protect your bridges and take the enemy HQ.`,"level.skirmish.name":`Random battle`,"level.skirmish.brief":`A fresh map and a fresh enemy, with everything unlocked. Build your network, keep the front supplied and reach the objective below.`,"level.daily.name":`Daily order`,"level.daily.brief":`Today every commander gets the same map, with everything unlocked. Your first win today earns a bonus star. Tomorrow brings a new order.`},de:{"level.1.name":`Erste Fuhre`,"level.1.brief":`Deine Lastwagen fahren schon von der Fabrik zu einem Depot an der Front. Kauf weitere Lastwagen, damit die Armeen satt bleiben, und bau Straßen und ein Depot nach, wenn sie vorrücken.`,"level.2.name":`Freie Straße`,"level.2.brief":`Eine Straße führt zur Front, aber es gibt noch kein Depot. Bau eines direkt hinter die Front, leg eine Route von der Fabrik an und kauf Lastwagen.`,"level.3.name":`Zwei Brücken`,"level.3.brief":`Ein Fluss teilt dein Land, und Brücken kosten fast das Doppelte. Fahr eine zweite Route von deiner anderen Fabrik, damit eine kaputte Brücke nicht die ganze Front aushungert.`,"level.4.name":`Fliegeralarm`,"level.4.brief":`Feindliche Flieger bombardieren jetzt deine Straßen und Brücken. Repariere Schäden schnell und halte dafür etwas Geld zurück.`,"level.5.name":`Eiserne Linie`,"level.5.brief":`Die Eisenbahn ist freigeschaltet. Eine Straßenroute fasst höchstens vier langsame Lastwagen, und auf langen Wegen kommen sie nicht hinterher. Bau deine längste viel befahrene Straße zur Bahn aus: Ein Zug trägt so viel wie sieben Lastwagen.`,"level.6.name":`Stille Lunte`,"level.6.brief":`Du kannst jetzt feindliche Verbindungen sabotieren. Spreng die Brücke oder Straße, die die Provinz versorgt, die du willst, und greif an, solange sie abgeschnitten ist.`,"level.7.name":`Schlammzeit`,"level.7.brief":`Regen zieht auf und macht die Straßen zu Schlamm: Lastwagen fahren nur noch halb so schnell. Züge stört das nicht, also bring vorher eine Bahn an die Front.`,"level.8.name":`Volle Tanks`,"level.8.brief":`Panzer kämpfen mit und brauchen neben Nachschub auch Treibstoff aus der Raffinerie. Leg eine Treibstoffroute zu den Depots deiner Panzer, ohne Sprit sind sie langsam und schwach.`,"level.9.name":`Standhalten`,"level.9.brief":`Der Feind bereitet eine große Offensive vor. Du musst nicht angreifen: Halte dein Hauptquartier, bis die Zeit um ist. Füll die Depots an der Front, bevor die Warnung kommt.`,"level.10.name":`Tiefer Frost`,"level.10.brief":`Kurz nach dem Start kommt der Winter: Armeen verbrauchen mehr, und alle Fahrzeuge sind langsamer. Füll die Depots vor dem Frost und plane mehr Lastwagen pro Route als sonst.`,"level.11.name":`Lange Front`,"level.11.brief":`Die Front ist lang und dünn: Such dir einen Abschnitt aus, versorg ihn voll und brich dort durch. Ab jetzt gibt es Sonderzüge. Schick den Panzerzug über deine Bahn direkt hinter diesen Abschnitt, dann greifen die Armeen daneben härter an.`,"level.12.name":`Steinerne Tore`,"level.12.brief":`Berge versperren die meisten Wege, und dort zu bauen ist teuer. Nutz Pässe und Täler für deine Linien und verteidige sie gut.`,"level.13.name":`Zwischen Flüssen`,"level.13.brief":`Zwei Flüsse durchziehen das Land, und die Uhr läuft. Das Hauptquartier brauchst du nicht: Erobere genug Provinzen, bevor die Zeit abläuft.`,"level.14.name":`Sturmfront`,"level.14.brief":`Der Feind schlägt zuerst zu: Seine Offensive beginnt fast sofort. Übersteh sie mit vollen Depots nahe der Front und schlag zurück, solange er neu aufbaut.`,"level.15.name":`Endstation`,"level.15.brief":`Die letzte Schlacht, mit allem auf einmal und einem starken Gegner. Bau früh Bahnen, schütz deine Brücken und nimm das feindliche Hauptquartier.`,"level.skirmish.name":`Zufallsschlacht`,"level.skirmish.brief":`Neue Karte, neuer Gegner, alles freigeschaltet. Bau dein Netz auf, halte die Front versorgt und erfülle das Ziel unten.`,"level.daily.name":`Tagesbefehl`,"level.daily.brief":`Heute bekommt jeder Kommandeur dieselbe Karte, alles ist freigeschaltet. Dein erster Sieg heute bringt einen Bonusstern. Morgen kommt ein neuer Befehl.`}},Vc={en:{"common.back":`Back`,"common.loading":`Loading`,"common.mission":`Mission {n}`,"common.random":`Random battle`,"common.locked":`Locked`,"common.stars":`Stars`,"title.tagline":`You run the supply. The armies fight on their own.`,"title.stamp":`Supply command`,"title.hello":`Hello, {name}`,"title.play":`Play`,"title.continue":`Continue`,"title.levels":`Missions`,"title.settings":`Settings`,"title.howto":`How to play`,"title.workshop":`Workshop`,"title.workshopAria":`Workshop, {n} stars to spend`,"title.daily":`Daily order`,"title.dailyLocked":`Win mission {n}`,"title.dailyOpen":`Not played yet`,"title.dailyWon":`Won today`,"title.streak":`Streak {n}`,"shop.title":`Workshop`,"shop.stars":`Stars to spend`,"shop.where":`Earn stars in missions and with the daily order. Upgrades last for good.`,"shop.buy":`Buy`,"shop.short":`{n} more needed`,"shop.max":`Maxed out`,"shop.rank":`Rank {r} of {max}`,"shop.buyAria":`Buy {name} for {n} stars`,"upgrade.depot.name":`Bigger depots`,"upgrade.depot.desc":`Depots hold {value}`,"upgrade.pioneers.name":`Swift pioneers`,"upgrade.pioneers.desc":`Repairs {value} faster`,"upgrade.budget.name":`Bigger budget`,"upgrade.budget.desc":`Start budget {value}`,"upgrade.sabotage.name":`Quick saboteurs`,"upgrade.sabotage.desc":`Sabotage cooldown {value}`,"upgrade.rail.name":`Cheap rail`,"upgrade.rail.desc":`Rail costs {value}`,"upgrade.trucks.name":`Fast trucks`,"upgrade.trucks.desc":`Trucks drive {value} faster`,"daily.title":`Daily order`,"daily.brief":`Fresh orders from HQ, the same for every commander today. Win for a bonus star, and come back tomorrow to keep your streak.`,"daily.today":`Today`,"daily.reward":`Reward`,"daily.firstWin":`Firs ein Gebiet`,"play.reason.notAdjacent":`Zu weit weg`,"play.reason.noMoney":`Nicht genug Geld`,"play.reason.exists":`Schon gebaut`,"play.reason.notAllowed":`In diesem Einsatz gesperrt`,"play.reason.noSource":`Keine Nachschubquelle`,"play.reason.noDepot":`Braucht ein Depot`,"play.reason.noPath":`Keine Verbindung`,"play.reason.notDamaged":`Nicht beschädigt`,"play.reason.cooldown":`Lädt nach`,"play.reason.notEnemy":`Nur feindliche Strecken`,"play.reason.noVehicle":`Kein Fahrzeug`,"play.reason.limit":`Limit erreicht`,"play.reason.invalid":`Nicht möglich`}},Uc={en:{"radio.starving.0":`Quartermaster, we're down to our last biscuit at {place}.`,"radio.starving.1":`The coffee ran out at {place}. Morale is following it.`,"radio.starving.2":`No crates at {place} for hours. The cook is boiling boots.`,"radio.starving.3":`We're eating the menu now. Send crates to {place}!`,"radio.starving.4":`{place} reporting: the soup is mostly hope by now.`,"radio.starving.5":`The lads at {place} keep staring down the supply road.`,"radio.starving.6":`Empty crates at {place}. We stack them to look busy.`,"radio.supplied.0":`Crates at {place}! The quartermaster is a legend.`,"radio.supplied.1":`Supply is back. The lads at {place} are singing. Badly.`,"radio.supplied.2":`Hot coffee at {place} again. I could weep. I won't.`,"radio.supplied.3":`Fresh socks at {place}! Morale up forty percent.`,"radio.supplied.4":`{place} is fed and grumbling again. A healthy sign.`,"radio.supplied.5":`Bread at {place}! Nobody ask about the date on it.`,"radio.supplied.6":`{place} is back in business. Thanks, quartermaster!`,"radio.attack.0":`Full bellies at {place}. We're going forward!`,"radio.attack.1":`Enough crates, enough waiting. {place} attacks!`,"radio.attack.2":`The lads at {place} had breakfast. Advancing now.`,"radio.attack.3":`Forward from {place}! Mind the puddles.`,"radio.attack.4":`{place} is pushing ahead. I've polished my binoculars.`,"radio.attack.5":`Boots laced, coffee drunk. {place} moves out!`,"radio.attack.6":`Advancing from {place}. Who has the map? The right one?`,"radio.captured.0":`{place} is ours! The mud here is much nicer.`,"radio.captured.1":`We hold {place}. Please send a flag and a broom.`,"radio.captured.2":`{place} taken. They left a perfectly good kettle.`,"radio.captured.3":`Flag up over {place}. Slightly crooked, but up.`,"radio.captured.4":`{place} secured. I'm told there's a bakery.`,"radio.captured.5":`We're in {place}. The barracks have real chairs!`,"radio.captured.6":`{place} is ours. I shall write a very long report.`,"radio.lost.0":`We had to fall back from {place}. Sorry, quartermaster.`,"radio.lost.1":`{place} is lost. We saved the coffee pot, at least.`,"radio.lost.2":`Pulling out of {place}. My good boots are still in there.`,"radio.lost.3":`{place} fell. We'll be back once the crates are.`,"radio.lost.4":`Lost {place}. The paperwork for this will be enormous.`,"radio.lost.5":`We gave up {place}. Strategically. Mostly.`,"radio.lost.6":`Leaving {place}. I did not run. I walked. Briskly.`,"radio.depotLost.0":`The depot at {place} is gone. All those lovely crates!`,"radio.depotLost.1":`We lost the depot at {place}. And the good blankets.`,"radio.depotLost.2":`Depot {place} overrun. My chocolate was hidden in there.`,"radio.depotLost.3":`No more depot at {place}. Build us a new one, please.`,"radio.depotLost.4":`The {place} depot is theirs now. They'll enjoy our jam.`,"radio.depotLost.5":`Depot {place} lost. The clerk saved the forms, at least.`,"radio.raid.0":`Bombers over {place}! The line is in pieces.`,"radio.raid.1":`They hit the line at {place}. Pioneers!`,"radio.raid.2":`Air raid on {place}. Lots of holes, no tracks.`,"radio.raid.3":`{place} got bombed. The trains are sulking.`,"radio.raid.4":`Line {place} wrecked. Send the wrench people!`,"radio.raid.5":`Planes over {place}! My hat is in a tree now.`,"radio.blocked.0":`The supply route to {place} is blocked!`,"radio.blocked.1":`No trucks get through to {place}. Clear the way!`,"radio.blocked.2":`Route to {place} is cut. The drivers are playing cards.`,"radio.blocked.3":`Nothing reaches {place}. The road ends in a crater.`,"radio.blocked.4":`Our convoy to {place} is stuck. Please fix the line.`,"radio.blocked.5":`{place} is cut off from supply. Sort it out, please!`,"radio.breakthrough.0":`Breakthrough! We're moving faster than the paperwork!`,"radio.breakthrough.1":`The front is wide open! Somebody tell the cook.`,"radio.breakthrough.2":`We broke through! Nobody expected that. Least of all me.`,"radio.breakthrough.3":`We broke through at {place}! Keep those crates coming!`,"radio.breakthrough.4":`Forward! Even the clerks are running.`,"radio.breakthrough.5":`Breakthrough at {place}! I lost my map. Doesn't matter!`,"radio.offensive.0":`Enemy offensive coming! Put the coffee down, lads.`,"radio.offensive.1":`They're massing across the line. Fill every depot!`,"radio.offensive.2":`Big attack on the way. Stock up, quartermaster!`,"radio.offensive.3":`Scouts say the enemy is coming. Boots on, everyone.`,"radio.offensive.4":`The enemy is planning something big. So should we.`,"radio.offensive.5":`Offensive incoming! Hide the biscuits, hold the line.`,"radio.rain.0":`Rain again. The trucks swim more than they drive.`,"radio.rain.1":`It's pouring. My boots hold two litres each now.`,"radio.rain.2":`Rain. Roads are mud. Good thing we have rails.`,"radio.rain.3":`Wet season. The paperwork is soggy and so am I.`,"radio.rain.4":`Raining sideways. The trucks are crawling.`,"radio.rain.5":`Rain, mud, more rain. The trains don't mind, I'm told.`,"radio.winter.0":`Winter. The coffee freezes before you can drink it.`,"radio.winter.1":`Snow everywhere. The lads need more of everything.`,"radio.winter.2":`It's freezing. I'm wearing three coats and a tablecloth.`,"radio.winter.3":`Winter is here. Send crates. And gloves. And crates.`,"radio.winter.4":`Everything is slow in this cold. Even the gossip.`,"radio.winter.5":`Snow on the line. The armies are eating double.`,"radio.armored.0":`The armored train is at {place}. The lads stand taller.`,"radio.armored.1":`Armored train in {place}! Now we can push properly.`,"radio.armored.2":`That armored train makes a lovely noise. Forward!`,"radio.armored.3":`Armored train at {place}. Polished and grumpy.`,"radio.armored.4":`The big train is here! {place} feels very brave now.`,"radio.armored.5":`Armored train at {place}. The other side looks worried.`,"radio.hospital.0":`Hospital train at {place}. Clean sheets! Real ones!`,"radio.hospital.1":`Nurses at {place}! The lads suddenly feel much better.`,"radio.hospital.2":`Hospital train is here. Soup, bandages and opinions.`,"radio.hospital.3":`Hospital train at {place}. My cough is very serious.`,"radio.hospital.4":`The doctors are here. No more grumbling allowed.`,"radio.hospital.5":`Hospital train at {place}. Even the cook got a check-up.`,"radio.engineer.0":`The engineer train is at {place}. Everything gets fixed!`,"radio.engineer.1":`Engineers at {place}! They fixed my chair first.`,"radio.engineer.2":`Engineer train is here. Broken lines, beware!`,"radio.engineer.3":`Engineers at {place}. They brought a crane and a kettle.`,"radio.engineer.4":`The engineers are here. They're measuring everything.`,"radio.engineer.5":`Engineer train at {place}. The wrench people have landed.`,"radio.loot.0":`Their depot at {place} was full. Thank you, enemy!`,"radio.loot.1":`We found crates in {place}. Finders keepers.`,"radio.loot.2":`Loot at {place}! Even their coffee beats ours.`,"radio.loot.3":`{place} had a full depot. We'll put it to good use.`,"radio.loot.4":`Captured supplies at {place}. The lads are delighted.`,"radio.loot.5":`Crates at {place}! Count them before the cook does.`},de:{"radio.starving.0":`Quartiermeister, in {place} gibt's nur noch Zwieback.`,"radio.starving.1":`In {place} ist der Kaffee alle. Die Stimmung bald auch.`,"radio.starving.2":`Keine Kisten in {place}. Der Koch kocht schon Stiefel.`,"radio.starving.3":`Wir essen bald die Speisekarte. Kisten nach {place}!`,"radio.starving.4":`{place} meldet: Die Suppe ist nur noch heißes Wasser.`,"radio.starving.5":`Die Jungs in {place} starren nur noch auf die Straße.`,"radio.starving.6":`Leere Kisten in {place}. Wir stapeln sie zur Deko.`,"radio.supplied.0":`Kisten in {place}! Ein Hoch auf den Quartiermeister!`,"radio.supplied.1":`Nachschub in {place}! Die Jungs singen. Schief.`,"radio.supplied.2":`Wieder heißer Kaffee in {place}. Ich bin gerührt.`,"radio.supplied.3":`Frische Socken in {place}! Moral plus vierzig Prozent.`,"radio.supplied.4":`{place} ist satt und meckert wieder. Alles gesund.`,"radio.supplied.5":`Brot in {place}! Nach dem Datum fragt lieber keiner.`,"radio.supplied.6":`In {place} läuft's wieder. Danke, Quartiermeister!`,"radio.attack.0":`Volle Bäuche in {place}. Wir rücken vor!`,"radio.attack.1":`Genug Kisten, genug gewartet. {place} greift an!`,"radio.attack.2":`Die Jungs in {place} haben gefrühstückt. Vorwärts!`,"radio.attack.3":`Vorwärts aus {place}! Vorsicht, Pfützen.`,"radio.attack.4":`{place} drückt nach vorn. Mein Fernglas ist poliert.`,"radio.attack.5":`Stiefel geschnürt, Kaffee getrunken. {place} rückt aus!`,"radio.attack.6":`Angriff aus {place}! Wer hat die Karte? Die richtige?`,"radio.captured.0":`{place} gehört uns! Der Matsch hier ist viel netter.`,"radio.captured.1":`Wir halten {place}. Bitte Fahne und Besen schicken.`,"radio.captured.2":`{place} genommen. Samt einem prima Wasserkessel.`,"radio.captured.3":`Fahne über {place}. Etwas schief, aber sie hängt.`,"radio.captured.4":`{place} gesichert. Angeblich gibt's hier eine Bäckerei.`,"radio.captured.5":`Wir sind in {place}. Die Kaserne hat echte Stühle!`,"radio.captured.6":`{place} ist unser. Das gibt einen sehr langen Bericht.`,"radio.lost.0":`Wir mussten {place} räumen. Tut mir leid, Quartiermeister.`,"radio.lost.1":`{place} ist verloren. Die Kaffeekanne ist gerettet.`,"radio.lost.2":`Rückzug aus {place}. Meine guten Stiefel sind noch drin.`,"radio.lost.3":`{place} ist weg. Wir kommen wieder, sobald Kisten kommen.`,"radio.lost.4":`{place} verloren. Der Papierkram dazu wird gewaltig.`,"radio.lost.5":`Wir haben {place} aufgegeben. Taktisch. Größtenteils.`,"radio.lost.6":`Rückzug aus {place}. Nicht gerannt. Zügig gegangen.`,"radio.depotLost.0":`Das Depot in {place} ist weg. Die schönen Kisten!`,"radio.depotLost.1":`Depot {place} verloren. Und die guten Decken auch.`,"radio.depotLost.2":`Depot {place} überrannt. Da lag meine Schokolade!`,"radio.depotLost.3":`Kein Depot mehr in {place}. Bitte baut ein neues.`,"radio.depotLost.4":`Das Depot in {place} gehört jetzt denen. Samt Marmelade.`,"radio.depotLost.5":`Depot {place} verloren. Die Formulare sind gerettet.`,"radio.raid.0":`Bomber über {place}! Die Strecke ist hin.`,"radio.raid.1":`Treffer auf {place}. Pioniere, bitte!`,"radio.raid.2":`Luftangriff auf {place}. Gleise? Eher Löcher.`,"radio.raid.3":`{place} wurde bombardiert. Die Züge schmollen.`,"radio.raid.4":`Strecke {place} kaputt. Schickt die Schrauber!`,"radio.raid.5":`Flieger über {place}! Mein Hut hängt im Baum.`,"radio.blocked.0":`Die Nachschubroute nach {place} ist blockiert!`,"radio.blocked.1":`Kein Lkw kommt nach {place} durch. Weg frei machen!`,"radio.blocked.2":`Route nach {place} gekappt. Die Fahrer spielen Karten.`,"radio.blocked.3":`Nichts erreicht {place}. Die Straße endet im Krater.`,"radio.blocked.4":`Unser Konvoi nach {place} steckt fest. Strecke flicken!`,"radio.blocked.5":`{place} ist abgeschnitten! Kümmer dich drum.`,"radio.breakthrough.0":`Durchbruch! Wir sind schneller als der Papierkram!`,"radio.breakthrough.1":`Die Front ist offen! Sagt dem Koch Bescheid.`,"radio.breakthrough.2":`Durchbruch! Damit hat keiner gerechnet. Ich am wenigsten.`,"radio.breakthrough.3":`Durchbruch bei {place}! Haltet die Kisten am Rollen!`,"radio.breakthrough.4":`Vorwärts! Sogar die Schreibstube rennt mit.`,"radio.breakthrough.5":`Durchbruch bei {place}! Karte verloren. Egal!`,"radio.offensive.0":`Feindliche Offensive! Kaffee abstellen, Jungs.`,"radio.offensive.1":`Drüben sammeln sie sich. Füllt jedes Depot!`,"radio.offensive.2":`Großangriff droht. Füll die Depots, Quartiermeister!`,"radio.offensive.3":`Die Späher sagen, der Feind kommt. Alle Stiefel an!`,"radio.offensive.4":`Der Feind plant was Großes. Wir sollten das auch.`,"radio.offensive.5":`Offensive im Anmarsch! Kekse verstecken, Stellung halten.`,"radio.rain.0":`Schon wieder Regen. Die Lkw schwimmen mehr, als sie fahren.`,"radio.rain.1":`Es schüttet. In jeden Stiefel passen zwei Liter.`,"radio.rain.2":`Regen, alles Matsch. Gut, dass wir Schienen haben.`,"radio.rain.3":`Alles nass. Der Papierkram weicht auf, ich auch.`,"radio.rain.4":`Regen von der Seite. Die Lastwagen kriechen nur noch.`,"radio.rain.5":`Regen, Matsch, noch mehr Regen. Den Zügen ist das egal.`,"radio.winter.0":`Winter. Der Kaffee friert, bevor man ihn trinkt.`,"radio.winter.1":`Überall Schnee. Die Jungs brauchen von allem mehr.`,"radio.winter.2":`Eiskalt. Ich trage drei Mäntel und eine Tischdecke.`,"radio.winter.3":`Winter ist da. Kisten schicken. Handschuhe. Mehr Kisten.`,"radio.winter.4":`Bei der Kälte ist alles langsam. Sogar der Tratsch.`,"radio.winter.5":`Schnee auf der Strecke. Die Armeen essen doppelt.`,"radio.armored.0":`Der Panzerzug steht in {place}. Die Jungs stehen gerader.`,"radio.armored.1":`Panzerzug in {place}! Jetzt wird richtig geschoben.`,"radio.armored.2":`Der Panzerzug macht so ein schönes Geräusch. Vorwärts!`,"radio.armored.3":`Panzerzug in {place}. Frisch poliert und schlecht gelaunt.`,"radio.armored.4":`Der große Zug ist da! {place} fühlt sich sehr mutig.`,"radio.armored.5":`Panzerzug in {place}. Drüben gucken sie besorgt.`,"radio.hospital.0":`Lazarettzug in {place}. Saubere Laken! Echte!`,"radio.hospital.1":`Sanitäter in {place}! Plötzlich geht's allen besser.`,"radio.hospital.2":`Der Lazarettzug ist da. Suppe, Verbände, Ratschläge.`,"radio.hospital.3":`Lazarettzug in {place}. Mein Husten ist sehr ernst.`,"radio.hospital.4":`Die Ärzte sind da. Jetzt wird nicht mehr gejammert.`,"radio.hospital.5":`Lazarettzug in {place}. Sogar der Koch wurde untersucht.`,"radio.engineer.0":`Pionierzug in {place}. Jetzt wird alles repariert!`,"radio.engineer.1":`Pioniere in {place}! Zuerst flicken sie meinen Stuhl.`,"radio.engineer.2":`Pionierzug eingetroffen. Kaputte Strecken, zittert!`,"radio.engineer.3":`Pioniere in {place}. Mit Kran und Wasserkessel.`,"radio.engineer.4":`Die Pioniere sind da. Sie vermessen einfach alles.`,"radio.engineer.5":`Pionierzug in {place}. Die Schrauber sind gelandet.`,"radio.loot.0":`Ihr Depot in {place} war voll. Danke schön, Feind!`,"radio.loot.1":`Kisten in {place} gefunden. Wer findet, der behält.`,"radio.loot.2":`Beute in {place}! Sogar ihr Kaffee ist besser.`,"radio.loot.3":`{place} hatte ein volles Depot. Das nehmen wir gern.`,"radio.loot.4":`Erbeuteter Nachschub in {place}. Die Jungs strahlen.`,"radio.loot.5":`Kisten in {place}! Zählt sie, bevor der Koch es tut.`}},Wc=[Vc,zc,Hc,Bc,Uc];function Gc(e){let t={};for(let n of Wc)Object.assign(t,n[e]);return t}function Kc(e){let t=e===`de`?`de`:`en`,n=Gc(`en`),r=t===`en`?n:Gc(t),i=new Set;return{locale:t,t(e,t){var a;let o=(a=r[e])==null?n[e]:a;return o===void 0&&(i.has(e)||(i.add(e),console.warn(`[i18n] missing text for key "${e}"`)),o=e),t?o.replace(/\{(\w+)\}/g,(e,n)=>n in t?String(t[n]):e):o}}}var qc=[1,4,2];function Jc(e){let t=`idle`,n=`mouse`,r=0,i=!1,a=-1,o=0,s=0,c=0,l=0,u=-1,d=0,f=0,p=0;function m(){t=`idle`,a=-1,u=-1}function h(){return n===`mouse`?6:10}function g(n,r,i){t===`drag`&&e.dragCancel(),u=n,d=r,f=i,p=Math.hypot(d-o,f-s),t=`pinch`}function _(t,n,r){let i=(o+d)/2,c=(s+f)/2;t===a?(o=n,s=r):(d=n,f=r);let l=(o+d)/2,u=(s+f)/2;(l!==i||u!==c)&&e.pan(l-i,u-c);let m=Math.hypot(d-o,f-s);m>=8&&p>=8&&m!==p&&e.zoom(l,u,m/p),m>=8&&(p=m)}function v(p,h,g){if(t===`pinch`){if(p===a)a=u,o=d,s=f;else if(p!==u)return;u=-1,t=`pan`;return}if(t===`idle`||p!==a)return;let _=t,v=n;m(),_===`press`?e.tap(c,l):_===`drag`?e.dragEnd(h
